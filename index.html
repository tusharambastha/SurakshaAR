<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/shield.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#E05A00" />
    <meta name="description" content="SurakshaAR — AR-Based Industrial Safety Training for Jharkhand's Mining & Manufacturing Sector" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Preload Indian script fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Noto+Sans+Ol+Chiki:wght@400;700&display=swap" rel="stylesheet" />
    <title>SurakshaAR — Immersive Safety Training</title>
    <script>
      (function() {
        function renderFatal(title, msg, stack) {
          var root = document.getElementById('root');
          var target = root || document.body || document.documentElement;
          var card = document.createElement('div');
          card.id = 'sar-fatal-box';
          card.style.cssText = 'position:fixed;inset:0;background:#FDF8F6;color:#1F2937;padding:24px;z-index:9999999;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;box-sizing:border-box;';
          card.innerHTML = '<div style="max-width:540px;width:100%;background:#FFFFFF;border:1.5px solid #FCA5A5;border-radius:16px;padding:32px;box-shadow:0 12px 36px rgba(0,0,0,0.12);text-align:center;">' +
            '<div style="font-size:44px;margin-bottom:12px;">⚠️</div>' +
            '<h2 style="color:#DC2626;font-size:1.3rem;font-weight:800;margin:0 0 10px;">' + title + '</h2>' +
            '<p style="font-size:0.92rem;color:#4B5563;line-height:1.6;margin:0 0 16px;word-break:break-word;">' + (msg || 'An issue occurred during application initialization.') + '</p>' +
            (stack ? '<pre style="text-align:left;background:#F3F4F6;color:#374151;padding:12px;border-radius:8px;font-size:11px;overflow:auto;max-height:160px;white-space:pre-wrap;margin:0 0 20px;">' + stack + '</pre>' : '') +
            '<div style="display:flex;flex-direction:column;gap:10px;">' +
              '<button onclick="window.location.reload(true);" style="background:#E05A00;color:#FFFFFF;border:none;padding:12px 20px;border-radius:10px;font-weight:700;font-size:0.95rem;cursor:pointer;width:100%;">Hard Reload Application</button>' +
              '<button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}window.location.hash=\'#/landing\';window.location.reload(true);" style="background:#F3F4F6;color:#374151;border:1px solid #D1D5DB;padding:10px 20px;border-radius:10px;font-weight:600;font-size:0.88rem;cursor:pointer;width:100%;">Reset Cache & Go to Home</button>' +
            '</div>' +
          '</div>';
          target.appendChild(card);
        }

        // Capture resource loading errors (scripts, stylesheets) using capture: true
        window.addEventListener('error', function(e) {
          if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
            var url = e.target.src || e.target.href || '';
            renderFatal('Resource Loading Issue', 'Could not load asset: ' + url + '. Your browser may have cached an outdated build of SurakshaAR.');
            return;
          }
          renderFatal('Startup Error', (e.message || 'Script error') + (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : ''), e.error && e.error.stack);
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : 'Unhandled rejection';
          renderFatal('Application Initialization Error', reason);
        });

        // Watchdog: If nothing has rendered inside #root after 3.8s, provide an immediate refresh helper
        setTimeout(function() {
          var r = document.getElementById('root');
          if (r && (!r.children.length || r.innerHTML.trim() === '') && !document.getElementById('sar-fatal-box')) {
            renderFatal('Loading Taking Longer Than Expected', 'The application is taking time to start. Please reload to sync the latest training assets.');
          }
        }, 3800);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
